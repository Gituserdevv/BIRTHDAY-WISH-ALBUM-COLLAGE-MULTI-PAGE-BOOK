<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Interactive Celebration Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #120911;
            --card-bg: rgba(28, 16, 26, 0.88);
            --accent-pink: #ff758f;
            --accent-glow: rgba(255, 117, 143, 0.8);
            --text-color: #fce4ec;
            --font-main: 'Poppins', sans-serif;
            --title-size: 1.1rem;
            --photo-height: 140px;
            --border-radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }

        /* Dynamic Sparkle Background */
        .stars-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #2a1124 0%, #120911 100%);
            z-index: 1;
        }
        .stars-bg.flash {
            animation: bgFlash 0.6s ease-out;
        }
        @keyframes bgFlash {
            0% { background: radial-gradient(circle at 50% 50%, #ff758f 0%, #2a1124 100%); }
            100% { background: radial-gradient(circle at 50% 50%, #2a1124 0%, #120911 100%); }
        }

        #particleContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2; overflow: hidden;
        }
        .particle {
            position: absolute; font-size: 1.3rem; pointer-events: none;
            animation: floatDown 3.5s linear infinite;
        }
        @keyframes floatDown {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Main Window Frame */
        .book-container {
            position: relative; z-index: 5;
            width: 90%; max-width: 420px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid rgba(255, 117, 143, 0.4);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
            backdrop-filter: blur(15px);
            padding: 20px 18px;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; text-align: center;
        }

        .chapter-title {
            font-size: var(--title-size); letter-spacing: 2px;
            color: #ffb3c1; text-transform: uppercase; font-weight: 700;
            text-shadow: 0 0 8px var(--accent-glow); margin-bottom: 10px;
        }

        /* Scratch-to-Reveal Blinking Photo Grid */
        .collage-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; width: 100%; margin: 10px 0;
        }

        .photo-card {
            position: relative; border-radius: var(--border-radius); overflow: hidden;
            height: var(--photo-height);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 117, 143, 0.4);
            cursor: pointer;
            /* Continuous Blinking Animation */
            animation: blinkGlow 1.5s infinite alternate;
        }
        .photo-card:nth-child(2) { animation-delay: 0.3s; }
        .photo-card:nth-child(3) { animation-delay: 0.6s; }
        .photo-card:nth-child(4) { animation-delay: 0.9s; }

        @keyframes blinkGlow {
            0% { box-shadow: 0 0 4px rgba(255, 117, 143, 0.2); border-color: rgba(255, 117, 143, 0.3); }
            100% { box-shadow: 0 0 22px var(--accent-pink), 0 0 10px #fff; border-color: #ffffff; }
        }

        .photo-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Scratch Foil Layer */
        .scratch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #fffdd0 50%, #aa771c 100%);
            display: flex; justify-content: center; align-items: center;
            color: #3a2228; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px;
            z-index: 4; border-radius: var(--border-radius);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .scratch-overlay.revealed { opacity: 0; pointer-events: none; transform: scale(1.1); }

        .nav-btn {
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
            border: none; color: #fff; padding: 10px 24px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 0 15px var(--accent-pink); margin-top: 10px;
        }

        .music-toggle {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); border: 1px solid var(--accent-pink);
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px);
        }
        .music-toggle.playing { animation: spin 4s linear infinite; box-shadow: 0 0 15px var(--accent-pink); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="stars-bg" id="bgLayer"></div>
    <div id="particleContainer"></div>

    <button class="music-toggle" id="musicBtn" onclick="toggleAudio()">🎵</button>
    <audio id="bgAudio" loop></audio>

    <div class="book-container">
        <div class="chapter-title" id="albumTitle">CHAPTER II • MEMORIES COLLAGE</div>

        <!-- 4 PHOTO COLLAGE GRID WITH SCRATCH COATING -->
        <div class="collage-grid">
            <div class="photo-card" onclick="scratchAndReveal(this, event)">
                <div class="scratch-overlay">✨ SCRATCH ME</div>
                <img id="img0" src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600">
            </div>
            <div class="photo-card" onclick="scratchAndReveal(this, event)">
                <div class="scratch-overlay">🌸 TAP TO UNLOCK</div>
                <img id="img1" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600">
            </div>
            <div class="photo-card" onclick="scratchAndReveal(this, event)">
                <div class="scratch-overlay">💖 SURPRISE</div>
                <img id="img2" src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=600">
            </div>
            <div class="photo-card" onclick="scratchAndReveal(this, event)">
                <div class="scratch-overlay">⭐ OPEN ME</div>
                <img id="img3" src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=600">
            </div>
        </div>

        <p style="font-size:0.75rem; color:#c97a8e;" id="hintText">Tap photos to scratch & reveal magic 🌸</p>
        <button class="nav-btn" onclick="alert('Moving to next chapter!')">READ WISHES ➔</button>
    </div>

    <script>
        const audio = document.getElementById('bgAudio');
        const musicBtn = document.getElementById('musicBtn');

        // Built-in Auto Songs for Greeting pages
        const DEFAULT_SONGS = {
            p1: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            p2: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            p3: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
            p4: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
        };

        window.onload = function() {
            applySavedStyles();
            setupAutoMusic();
        };

        function applySavedStyles() {
            // Apply Font & Title
            const font = localStorage.getItem('cfg_font') || "'Poppins', sans-serif";
            const titleSize = localStorage.getItem('cfg_title_size') || '1.1rem';
            document.documentElement.style.setProperty('--font-main', font);
            document.documentElement.style.setProperty('--title-size', titleSize);

            const savedTitle = localStorage.getItem('cfg_title');
            if (savedTitle) document.getElementById('albumTitle').innerText = savedTitle;

            // Apply Photo Size & Radius
            const photoHeight = localStorage.getItem('cfg_photo_height') || '140px';
            const borderRadius = localStorage.getItem('cfg_border_radius') || '14px';
            document.documentElement.style.setProperty('--photo-height', photoHeight);
            document.documentElement.style.setProperty('--border-radius', borderRadius);

            // Photos Load
            const savedPhotos = localStorage.getItem('cfg_photos');
            if (savedPhotos) {
                const photos = savedPhotos.split('|||');
                photos.forEach((src, idx) => {
                    if (src && document.getElementById(`img${idx}`)) {
                        document.getElementById(`img${idx}`).src = src;
                    }
                });
            }

            // Continuous Background Particle Rain
            startParticleRain();
        }

        function setupAutoMusic() {
            const savedSongs = JSON.parse(localStorage.getItem('cfg_multi_songs') || '{}');
            const songData = savedSongs['p3'] || { url: DEFAULT_SONGS.p3, start: 0, end: 30 };
            
            const songUrl = songData.url && songData.url.trim() !== '' ? songData.url : DEFAULT_SONGS.p3;
            audio.src = songUrl;
            audio.currentTime = songData.start || 0;

            audio.ontimeupdate = function() {
                if (songData.end && audio.currentTime >= songData.end) {
                    audio.currentTime = songData.start || 0;
                }
            };

            // First Interaction Auto-Play Trigger
            const playHandler = () => {
                audio.play().then(() => musicBtn.classList.add('playing')).catch(() => {});
                document.removeEventListener('click', playHandler);
                document.removeEventListener('touchstart', playHandler);
            };
            document.addEventListener('click', playHandler);
            document.addEventListener('touchstart', playHandler);
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicBtn.classList.add('playing');
            } else {
                audio.pause();
                musicBtn.classList.remove('playing');
            }
        }

        // Photo Scratch & Blast Animation
        function scratchAndReveal(card, e) {
            const overlay = card.querySelector('.scratch-overlay');
            if (overlay) overlay.classList.add('revealed');

            // Flash Background Effect
            const bg = document.getElementById('bgLayer');
            bg.classList.add('flash');
            setTimeout(() => bg.classList.remove('flash'), 600);

            // Sparkle & Flower Explosion
            const pType = localStorage.getItem('cfg_particle_type') || 'flower';
            const icons = pType === 'star' ? ['⭐', '✨', '💫'] : pType === 'glitter' ? ['💖', '💎', '✨'] : ['🌸', '🌺', '✨', '💖'];

            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerText = icons[Math.floor(Math.random() * icons.length)];
                p.style.left = (e.clientX + (Math.random() * 100 - 50)) + 'px';
                p.style.top = (e.clientY + (Math.random() * 100 - 50)) + 'px';
                p.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                document.getElementById('particleContainer').appendChild(p);

                setTimeout(() => p.remove(), 2500);
            }
        }

        function startParticleRain() {
            const container = document.getElementById('particleContainer');
            const pType = localStorage.getItem('cfg_particle_type') || 'flower';
            const icons = pType === 'star' ? ['⭐', '✨'] : pType === 'glitter' ? ['💖', '✨'] : ['🌸', '✨'];

            setInterval(() => {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerText = icons[Math.floor(Math.random() * icons.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = '-20px';
                p.style.animationDuration = (3 + Math.random() * 3) + 's';
                container.appendChild(p);
                setTimeout(() => p.remove(), 5000);
            }, 600);
        }
    </script>
</body>
</html>
