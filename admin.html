 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Manager Admin</title>
    <style>
        body { background: #0f0810; color: #ffb3c1; font-family: sans-serif; padding: 20px; }
        .card { max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid #ffb3c1; }
        textarea { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #ffb3c1; border-radius: 8px; margin: 10px 0; }
        button { width: 100%; padding: 12px; background: #ff758f; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🖼️ Dynamic Photo Manager</h2>
        <label>Album Photos URLs (Comma separated):</label>
        <textarea id="photoList" rows="5" placeholder="https://image1.jpg, https://image2.jpg"></textarea>
        <button onclick="savePhotos()">UPDATE ALBUM PHOTOS ✨</button>
    </div>

    <script>
        document.getElementById('photoList').value = localStorage.getItem('cfg_photos') || "";
        function savePhotos() {
            const input = document.getElementById('photoList').value;
            localStorage.setItem('cfg_photos', input);
            alert("Photos updated successfully!");
        }
    </script>
</body>
</html>
