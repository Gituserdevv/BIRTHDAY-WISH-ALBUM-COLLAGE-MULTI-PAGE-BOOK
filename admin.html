<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Studio Administrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-bg: #fff0f5;
            --card-bg: #ffffff;
            --primary-pink: #ff477e;
            --accent-pink: #ff758f;
            --text-color: #2b2d42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--admin-bg);
            color: var(--text-color);
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 25px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.15); margin-bottom: 20px;
            border: 1px solid #ffccd5;
        }

        h1 { font-size: 1.4rem; color: var(--primary-pink); display: flex; align-items: center; gap: 8px; }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 10px 18px; border-radius: 20px; border: none; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; font-size: 0.85rem;
        }
        .btn-primary { background: var(--primary-pink); color: white; box-shadow: 0 4px 10px rgba(255, 71, 126, 0.3); }
        .btn-primary:hover { background: #ff0054; transform: translateY(-2px); }
        .btn-secondary { background: #e9ecef; color: #495057; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px;
        }

        .admin-card {
            background: var(--card-bg); padding: 20px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #ffccd5;
        }

        .card-title {
            font-size: 1rem; font-weight: 700; color: var(--primary-pink);
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
            border-bottom: 2px dashed #ffe6ea; padding-bottom: 8px;
        }

        .input-group { margin-bottom: 12px; }
        label { font-size: 0.8rem; font-weight: 600; color: #555; display: block; margin-bottom: 4px; }
        input[type="text"], textarea, select {
            width: 100%; padding: 8px 12px; border: 1px solid #ffb3c1; border-radius: 8px;
            font-size: 0.85rem; outline: none; background: #fff5f7;
        }
        textarea { height: 70px; resize: vertical; }

        /* Photo Upload Slots */
        .photo-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .slot {
            background: #fff0f3; border: 1px dashed var(--accent-pink); border-radius: 10px;
            padding: 8px; text-align: center; font-size: 0.75rem;
        }
        .slot img { width: 100%; height: 60px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; }
        .file-btn { font-size: 0.65rem; }

        /* Music Controls */
        .music-item { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .music-item input { flex: 1; }
        .test-audio-btn {
            background: #ff758f; color: white; border: none; border-radius: 50%;
            width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Master Studio Administrator</h1>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="resetDefaults()">Reset 🔄</button>
            <button class="btn btn-primary" onclick="saveData()">Save & Apply ✨</button>
        </div>
    </header>

    <div class="grid-container">

        <!-- PHOTO UPLOADER -->
        <div class="admin-card">
            <div class="card-title">🖼️ Collage & Portrait Photos (4 Slots)</div>
            <div class="photo-slots">
                <div class="slot">
                    <img id="prev0" src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400">
                    <input type="file" class="file-btn" onchange="uploadImg(0, event)">
                </div>
                <div class="slot">
                    <img id="prev1" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400">
                    <input type="file" class="file-btn" onchange="uploadImg(1, event)">
                </div>
                <div class="slot">
                    <img id="prev2" src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=400">
                    <input type="file" class="file-btn" onchange="uploadImg(2, event)">
                </div>
                <div class="slot">
                    <img id="prev3" src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400">
                    <input type="file" class="file-btn" onchange="uploadImg(3, event)">
                </div>
            </div>
        </div>

        <!-- PAGE MUSIC SYNC -->
        <div class="admin-card">
            <div class="card-title">🎵 Page Wise Music Sync (Custom URLs or Auto)</div>
            
            <div class="input-group">
                <label>1. Envelope Cover Song URL</label>
                <div class="music-item">
                    <input type="text" id="songP1" placeholder="Audio MP3 URL">
                    <button class="test-audio-btn" onclick="testAudio('songP1')">▶</button>
                </div>
            </div>

            <div class="input-group">
                <label>2. Portrait Scratch Song URL</label>
                <div class="music-item">
                    <input type="text" id="songP2" placeholder="Audio MP3 URL">
                    <button class="test-audio-btn" onclick="testAudio('songP2')">▶</button>
                </div>
            </div>

            <div class="input-group">
                <label>3. Collage Grid Song URL</label>
                <div class="music-item">
                    <input type="text" id="songP3" placeholder="Audio MP3 URL">
                    <button class="test-audio-btn" onclick="testAudio('songP3')">▶</button>
                </div>
            </div>

            <div class="input-group">
                <label>4. Wish & Cake Page Song URL</label>
                <div class="music-item">
                    <input type="text" id="songP4" placeholder="Audio MP3 URL">
                    <button class="test-audio-btn" onclick="testAudio('songP4')">▶</button>
                </div>
            </div>
        </div>

        <!-- TEXT & FONTS -->
        <div class="admin-card">
            <div class="card-title">✍️ Text Customization & Greetings</div>
            <div class="input-group">
                <label>Greeting Title</label>
                <input type="text" id="cfgTitle" value="HAPPY BIRTHDAY QUEEN! 👑">
            </div>
            <div class="input-group">
                <label>Font Style</label>
                <select id="cfgFont">
                    <option value="'Poppins', sans-serif">Modern Clean (Poppins)</option>
                    <option value="'Dancing Script', cursive">Royal Cursive (Dancing Script)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Wish Message (Page 4)</label>
                <textarea id="cfgWish">May your birthday be filled with endless joy, magic, warmth, and beautiful smiles! Keep shining bright always! ✨💖</textarea>
            </div>
        </div>

        <!-- LAYOUT & ANIMATIONS -->
        <div class="admin-card">
            <div class="card-title">🎨 Visual Styling & Particle FX</div>
            <div class="input-group">
                <label>Photo Corner Curves</label>
                <select id="cfgCorners">
                    <option value="18px">Smooth Royal Curves (18px)</option>
                    <option value="25px">Extra Curved Soft (25px)</option>
                    <option value="10px">Classic Subtle (10px)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Blast & Floating Particle Effect</label>
                <select id="cfgParticles">
                    <option value="flower">Flowers 🌸 & Pink Petals</option>
                    <option value="star">Magic Stars ⭐ & Gold Glow</option>
                    <option value="glitter">Glitter Hearts 💖 & Diamonds</option>
                </select>
            </div>
        </div>

    </div>

    <script>
        let photoData = [
            'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400',
            'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400',
            'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=400',
            'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400'
        ];

        window.onload = function() {
            loadSavedData();
        };

        function uploadImg(idx, e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    photoData[idx] = evt.target.result;
                    document.getElementById(`prev${idx}`).src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveData() {
            localStorage.setItem('cfg_title', document.getElementById('cfgTitle').value);
            localStorage.setItem('cfg_font', document.getElementById('cfgFont').value);
            localStorage.setItem('cfg_wish', document.getElementById('cfgWish').value);
            localStorage.setItem('cfg_corners', document.getElementById('cfgCorners').value);
            localStorage.setItem('cfg_particles', document.getElementById('cfgParticles').value);

            localStorage.setItem('cfg_photos', photoData.join('|||'));

            const songs = {
                p1: document.getElementById('songP1').value,
                p2: document.getElementById('songP2').value,
                p3: document.getElementById('songP3').value,
                p4: document.getElementById('songP4').value
            };
            localStorage.setItem('cfg_multi_songs', JSON.stringify(songs));

            alert('✨ All settings, audio, and photo customisations saved successfully!');
        }

        function loadSavedData() {
            if (localStorage.getItem('cfg_title')) document.getElementById('cfgTitle').value = localStorage.getItem('cfg_title');
            if (localStorage.getItem('cfg_font')) document.getElementById('cfgFont').value = localStorage.getItem('cfg_font');
            if (localStorage.getItem('cfg_wish')) document.getElementById('cfgWish').value = localStorage.getItem('cfg_wish');
            if (localStorage.getItem('cfg_corners')) document.getElementById('cfgCorners').value = localStorage.getItem('cfg_corners');
            if (localStorage.getItem('cfg_particles')) document.getElementById('cfgParticles').value = localStorage.getItem('cfg_particles');

            const savedPhotos = localStorage.getItem('cfg_photos');
            if (savedPhotos) {
                photoData = savedPhotos.split('|||');
                photoData.forEach((src, idx) => {
                    if (src && document.getElementById(`prev${idx}`)) {
                        document.getElementById(`prev${idx}`).src = src;
                    }
                });
            }

            const savedSongs = JSON.parse(localStorage.getItem('cfg_multi_songs') || '{}');
            if (savedSongs.p1) document.getElementById('songP1').value = savedSongs.p1;
            if (savedSongs.p2) document.getElementById('songP2').value = savedSongs.p2;
            if (savedSongs.p3) document.getElementById('songP3').value = savedSongs.p3;
            if (savedSongs.p4) document.getElementById('songP4').value = savedSongs.p4;
        }

        let currentAudio = null;
        function testAudio(inputId) {
            const url = document.getElementById(inputId).value;
            if (!url) return alert('Please enter an audio URL first!');
            if (currentAudio) currentAudio.pause();
            currentAudio = new Audio(url);
            currentAudio.play().catch(e => alert('Audio play failed: ' + e.message));
        }

        function resetDefaults() {
            if (confirm('Reset all customization to default?')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
