<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Studio | Admin Control Panel</title>
    <style>
        :root {
            --bg-color: #fffafb;
            --card-bg: rgba(255, 255, 255, 0.85);
            --pink-main: #ff758f;
            --pink-soft: #ffb3c1;
            --pink-light: #fff0f3;
            --text-dark: #4a2c35;
            --shadow: 0 10px 30px rgba(255, 117, 143, 0.15);
        }

        body {
            background: linear-gradient(135deg, #fff5f7 0%, #ffe6ea 100%);
            color: var(--text-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Petals Animation Effect */
        .petal {
            position: absolute;
            background: #ffb3c1;
            border-radius: 150% 0 150% 0;
            opacity: 0.3;
            pointer-events: none;
            animation: animate-petals 10s linear infinite;
        }
        .petal:nth-child(1) { width: 15px; height: 15px; left: 10%; animation-duration: 7s; }
        .petal:nth-child(2) { width: 20px; height: 20px; left: 30%; animation-duration: 9s; animation-delay: 2s; }
        .petal:nth-child(3) { width: 12px; height: 12px; left: 70%; animation-duration: 6s; animation-delay: 1s; }
        .petal:nth-child(4) { width: 18px; height: 18px; left: 85%; animation-duration: 11s; animation-delay: 3s; }

        @keyframes animate-petals {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.4; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .dashboard {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 10;
        }

        .header {
            text-align: center;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--pink-main);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: #8c5d6b;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: var(--pink-main);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--pink-light);
            padding-bottom: 10px;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .photo-slot {
            background: var(--pink-light);
            border: 2px dashed var(--pink-soft);
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .photo-slot:hover {
            border-color: var(--pink-main);
            background: #ffe6ea;
        }

        .photo-slot label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .preview-box {
            width: 100%;
            height: 110px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--pink-soft);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-box span {
            font-size: 0.75rem;
            color: #b58391;
            text-align: center;
            padding: 5px;
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            background: #ffffff;
            color: var(--text-dark);
            border: 1.5px solid var(--pink-soft);
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--pink-main);
            box-shadow: 0 0 8px rgba(255, 117, 143, 0.25);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 8px 0;
            background: var(--pink-main);
            color: #ffffff;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .file-upload-btn:hover {
            background: #ff4d6d;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 77, 109, 0.4);
        }

        .song-item {
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border: 1px solid var(--pink-soft);
        }

        .song-item button {
            background: var(--pink-main);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .status-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>

    <div class="dashboard">
        <div class="header">
            <h1>🌸 Studio Administration</h1>
            <p>Customize Photos, Music Timelines, Messages & Settings</p>
        </div>

        <!-- 1. PHOTO MANAGEMENT -->
        <div class="card">
            <h2>🖼️ Dedicated Photo Slots</h2>
            <div class="slot-grid">
                <!-- Slot 1 -->
                <div class="photo-slot">
                    <label>1. Cover Photo</label>
                    <div class="preview-box" id="pBox1"><span>No Image</span></div>
                    <label for="f1" class="file-upload-btn">Upload Image</label>
                    <input type="file" id="f1" accept="image/*" onchange="processSlot(event, 0)">
                    <input type="text" id="url1" placeholder="Or Image URL..." onchange="updateFromUrl(this.value, 0)">
                </div>

                <!-- Slot 2 -->
                <div class="photo-slot">
                    <label>2. Scratch Card</label>
                    <div class="preview-box" id="pBox2"><span>No Image</span></div>
                    <label for="f2" class="file-upload-btn">Upload Image</label>
                    <input type="file" id="f2" accept="image/*" onchange="processSlot(event, 1)">
                    <input type="text" id="url2" placeholder="Or Image URL..." onchange="updateFromUrl(this.value, 1)">
                </div>

                <!-- Slot 3 -->
                <div class="photo-slot">
                    <label>3. Gallery Image 1</label>
                    <div class="preview-box" id="pBox3"><span>No Image</span></div>
                    <label for="f3" class="file-upload-btn">Upload Image</label>
                    <input type="file" id="f3" accept="image/*" onchange="processSlot(event, 2)">
                    <input type="text" id="url3" placeholder="Or Image URL..." onchange="updateFromUrl(this.value, 2)">
                </div>

                <!-- Slot 4 -->
                <div class="photo-slot">
                    <label>4. Gallery Image 2</label>
                    <div class="preview-box" id="pBox4"><span>No Image</span></div>
                    <label for="f4" class="file-upload-btn">Upload Image</label>
                    <input type="file" id="f4" accept="image/*" onchange="processSlot(event, 3)">
                    <input type="text" id="url4" placeholder="Or Image URL..." onchange="updateFromUrl(this.value, 3)">
                </div>
            </div>
        </div>

        <!-- 2. MUSIC & TIMELINE ENGINE -->
        <div class="card">
            <h2>🎵 Music & Offset Timelines</h2>
            
            <label style="font-size:0.8rem; font-weight:600; color:#6b424f;">In-App Track Search Engine:</label>
            <div style="display:flex; gap:8px; margin-top:6px; margin-bottom:10px;">
                <input type="text" id="songSearch" placeholder="Search track/artist name...">
                <button style="width:28%; background:var(--pink-main); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="searchTrack()">Search</button>
            </div>
            <div id="searchResults"></div>

            <label style="font-size:0.8rem; font-weight:600; color:#6b424f; margin-top:10px; display:block;">Or MP3 Direct Track URL:</label>
            <input type="text" id="audioUrl" placeholder="https://domain.com/song.mp3">

            <h4 style="margin: 20px 0 10px 0; font-size: 0.9rem; color: var(--pink-main);">⏱️ Precise Audio Offset Timestamps (Seconds)</h4>
            <div class="grid-2">
                <div><label style="font-size:0.75rem; font-weight:600;">Cover Sec:</label><input type="number" id="t1" value="0"></div>
                <div><label style="font-size:0.75rem; font-weight:600;">Scratch Sec:</label><input type="number" id="t2" value="10"></div>
                <div><label style="font-size:0.75rem; font-weight:600;">Gallery Sec:</label><input type="number" id="t3" value="20"></div>
                <div><label style="font-size:0.75rem; font-weight:600;">Wishes Sec:</label><input type="number" id="t4" value="30"></div>
            </div>
        </div>

        <!-- 3. ADDITIONAL FEATURES (MESSAGES & TEXTS) -->
        <div class="card">
            <h2>✍️ Birthday Greetings & Wishes Text</h2>
            <label style="font-size:0.8rem; font-weight:600;">Title Text:</label>
            <input type="text" id="albumTitle" placeholder="Happy Birthday Birthday Queen" style="margin-bottom:12px;">

            <label style="font-size:0.8rem; font-weight:600;">Custom Wishing Message:</label>
            <textarea id="wishMessage" rows="3" placeholder="Write your heartfelt message here..."></textarea>
        </div>

        <button class="btn-submit" onclick="commitChanges()">APPLY & DEPLOY TO ALBUM ✨</button>
    </div>

    <script>
        let photoSlots = ["", "", "", ""];

        // On Load - Restore existing data if available
        window.onload = function() {
            const savedPhotos = localStorage.getItem('cfg_photos');
            if (savedPhotos) {
                photoSlots = savedPhotos.split('|||');
                photoSlots.forEach((src, idx) => {
                    if (src) {
                        renderPreview(idx, src);
                        if (src.startsWith('http')) {
                            document.getElementById(`url${idx + 1}`).value = src;
                        }
                    }
                });
            }

            document.getElementById('audioUrl').value = localStorage.getItem('cfg_music') || "";

            const timeline = JSON.parse(localStorage.getItem('cfg_audio_timeline') || '{}');
            if (timeline.page1) document.getElementById('t1').value = timeline.page1.startTime;
            if (timeline.page2) document.getElementById('t2').value = timeline.page2.startTime;
            if (timeline.page3) document.getElementById('t3').value = timeline.page3.startTime;
            if (timeline.page4) document.getElementById('t4').value = timeline.page4.startTime;

            document.getElementById('albumTitle').value = localStorage.getItem('cfg_title') || "";
            document.getElementById('wishMessage').value = localStorage.getItem('cfg_wish') || "";
        };

        // File Handler with Canvas Compression
        function processSlot(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxDim = 800;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                        else { w = Math.round((w * maxDim) / h); h = maxDim; }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);

                    const compressedData = canvas.toDataURL('image/jpeg', 0.75);
                    photoSlots[index] = compressedData;
                    renderPreview(index, compressedData);
                };
            };
            reader.readAsDataURL(file);
        }

        function updateFromUrl(url, index) {
            if (!url) return;
            photoSlots[index] = url;
            renderPreview(index, url);
        }

        function renderPreview(index, src) {
            const box = document.getElementById(`pBox${index + 1}`);
            box.innerHTML = `<img src="${src}">`;
        }

        async function searchTrack() {
            const query = document.getElementById('songSearch').value.trim();
            if (!query) return alert("Song name enter karein!");

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "<p style='font-size:0.8rem; color:#888;'>Searching tracks...</p>";

            try {
                const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=56d30c95&format=json&limit=4&search=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                resultsDiv.innerHTML = "";
                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = "<p style='font-size:0.8rem; color:red;'>No tracks found.</p>";
                    return;
                }

                data.results.forEach(t => {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.innerHTML = `
                        <span><b>${t.name}</b> (${t.artist_name})</span>
                        <button onclick="selectSong('${t.audio}')">Select</button>
                    `;
                    resultsDiv.appendChild(item);
                });
            } catch (err) {
                resultsDiv.innerHTML = "<p style='font-size:0.8rem; color:red;'>Search failed. Try again.</p>";
            }
        }

        function selectSong(url) {
            document.getElementById('audioUrl').value = url;
            alert("Song Selected Successfully!");
        }

        function commitChanges() {
            localStorage.setItem('cfg_photos', photoSlots.join('|||'));
            localStorage.setItem('cfg_music', document.getElementById('audioUrl').value);
            
            const timeline = {
                page1: { startTime: parseInt(document.getElementById('t1').value) || 0 },
                page2: { startTime: parseInt(document.getElementById('t2').value) || 10 },
                page3: { startTime: parseInt(document.getElementById('t3').value) || 20 },
                page4: { startTime: parseInt(document.getElementById('t4').value) || 30 }
            };
            localStorage.setItem('cfg_audio_timeline', JSON.stringify(timeline));

            localStorage.setItem('cfg_title', document.getElementById('albumTitle').value);
            localStorage.setItem('cfg_wish', document.getElementById('wishMessage').value);

            alert("Settings Deployed Successfully! ✨ Check index.html now.");
        }
    </script>
</body>
</html>
