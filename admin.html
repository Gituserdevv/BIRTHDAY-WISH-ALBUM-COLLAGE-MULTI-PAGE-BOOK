<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Book Studio Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #1a1a2e; color: #fff; padding: 20px; max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #16213e; padding: 15px 20px; border-radius: 12px; }
        h1 { font-size: 1.2rem; color: #e94560; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-save { background: #e94560; color: #fff; }
        .btn-reset { background: #0f3460; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 15px; }
        .card { background: #16213e; padding: 15px; border-radius: 12px; border: 1px solid #0f3460; }
        .card-title { color: #e94560; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid #0f3460; padding-bottom: 5px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #a2a8d3; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #fff; }
        textarea { height: 60px; }
        .photo-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .slot img { width: 100%; height: 50px; object-fit: cover; border-radius: 4px; }
        .slot input { font-size: 0.6rem; width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>🛠️ Wish Book Administrator</h1>
        <div>
            <button class="btn btn-reset" onclick="resetData()">Reset</button>
            <button class="btn btn-save" onclick="saveData()">Save Changes ✨</button>
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">🎭 Occasion & Theme</div>
            <div class="input-group">
                <label>Preset Event</label>
                <select id="cfgOccasion" onchange="autoFill()">
                    <option value="birthday">Birthday Celebration</option>
                    <option value="anniversary">Anniversary</option>
                    <option value="love">Love / Valentine</option>
                </select>
            </div>
            <div class="input-group">
                <label>Main Title</label>
                <input type="text" id="cfgTitle" value="HAPPY BIRTHDAY QUEEN! 👑">
            </div>
            <div class="input-group">
                <label>Wish Text</label>
                <textarea id="cfgWish">May your day be filled with endless joy, laughter, warmth, and beautiful surprises! Happy Birthday! ✨🌸</textarea>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🖼️ Upload Photos (4 Slots)</div>
            <div class="photo-slots">
                <div class="slot"><img id="p0"><input type="file" onchange="up(0, event)"></div>
                <div class="slot"><img id="p1"><input type="file" onchange="up(1, event)"></div>
                <div class="slot"><img id="p2"><input type="file" onchange="up(2, event)"></div>
                <div class="slot"><img id="p3"><input type="file" onchange="up(3, event)"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🎵 Page Songs (MP3 Links)</div>
            <div class="input-group"><label>Page 1 Song</label><input type="text" id="s1"></div>
            <div class="input-group"><label>Page 2 Song</label><input type="text" id="s2"></div>
            <div class="input-group"><label>Page 3 Song</label><input type="text" id="s3"></div>
            <div class="input-group"><label>Page 4 Song</label><input type="text" id="s4"></div>
        </div>
    </div>

    <script>
        let photos = [
            'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400',
            'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400',
            'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=400',
            'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400'
        ];

        window.onload = function() {
            if (localStorage.getItem('wb_title')) document.getElementById('cfgTitle').value = localStorage.getItem('wb_title');
            if (localStorage.getItem('wb_wish')) document.getElementById('cfgWish').value = localStorage.getItem('wb_wish');
            
            let pSaved = localStorage.getItem('wb_photos');
            if (pSaved) photos = pSaved.split('|||');
            photos.forEach((src, i) => { if(document.getElementById('p'+i)) document.getElementById('p'+i).src = src; });

            let sSaved = JSON.parse(localStorage.getItem('wb_songs') || '{}');
            if(sSaved.s1) document.getElementById('s1').value = sSaved.s1;
            if(sSaved.s2) document.getElementById('s2').value = sSaved.s2;
            if(sSaved.s3) document.getElementById('s3').value = sSaved.s3;
            if(sSaved.s4) document.getElementById('s4').value = sSaved.s4;
        };

        function autoFill() {
            let o = document.getElementById('cfgOccasion').value;
            if(o === 'birthday') {
                document.getElementById('cfgTitle').value = "HAPPY BIRTHDAY QUEEN! 👑";
                document.getElementById('cfgWish').value = "May your day be filled with endless joy, laughter, warmth, and beautiful surprises! Happy Birthday! ✨🌸";
            } else if(o === 'anniversary') {
                document.getElementById('cfgTitle').value = "HAPPY ANNIVERSARY! 🥂💍";
                document.getElementById('cfgWish').value = "Wishing you both another year of togetherness and everlasting happiness!";
            } else {
                document.getElementById('cfgTitle').value = "MY FOREVER LOVE 💖🌹";
                document.getElementById('cfgWish').value = "Every moment with you feels like magic. Thank you for being in my life!";
            }
        }

        function up(i, e) {
            let file = e.target.files[0];
            if(file) {
                let r = new FileReader();
                r.onload = function(evt) {
                    photos[i] = evt.target.result;
                    document.getElementById('p'+i).src = evt.target.result;
                };
                r.readAsDataURL(file);
            }
        }

        function saveData() {
            localStorage.setItem('wb_title', document.getElementById('cfgTitle').value);
            localStorage.setItem('wb_wish', document.getElementById('cfgWish').value);
            localStorage.setItem('wb_photos', photos.join('|||'));
            let songs = {
                s1: document.getElementById('s1').value,
                s2: document.getElementById('s2').value,
                s3: document.getElementById('s3').value,
                s4: document.getElementById('s4').value
            };
            localStorage.setItem('wb_songs', JSON.stringify(songs));
            alert('Saved successfully!');
        }

        function resetData() {
            if(confirm('Reset all saved settings?')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
