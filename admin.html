<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Control</title>
    <style>
        body { background: #0b0710; color: #ffb3c1; font-family: sans-serif; padding: 20px; }
        .card { max-width: 500px; margin: 0 auto 20px auto; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid #ffb3c1; }
        input[type="text"], input[type="number"], textarea { width: 95%; padding: 10px; background: #000; color: #fff; border: 1px solid #ffb3c1; border-radius: 8px; margin: 6px 0; }
        button { width: 100%; padding: 12px; background: #ff758f; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .song-item { background: #1b102b; padding: 8px; margin-top: 5px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .song-item button { width: auto; padding: 5px 10px; margin: 0; background: #00f5d4; }
    </style>
</head>
<body>

    <!-- 1. PHOTOS SECTION (GALLERY UPLOAD + DIRECT URL BOTH) -->
    <div class="card">
        <h2>🖼️ Photos Management</h2>
        <label>Option A: Direct Gallery Upload (No URLs)</label>
        <input type="file" id="photoPicker" accept="image/*" multiple onchange="handleImageUpload(event)">
        
        <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
        
        <label>Option B: Image URLs (Comma separated)</label>
        <textarea id="photoUrls" rows="3" placeholder="https://img1.jpg, https://img2.jpg"></textarea>
    </div>

    <!-- 2. MUSIC & TIMELINE SECTION -->
    <div class="card">
        <h2>🎵 Music & Timeline Control</h2>
        
        <label>In-App Music Search Engine:</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="songQuery" placeholder="Song ka naam search karein...">
            <button style="width:30%; margin: 6px 0 0 0;" onclick="searchTracks()">Search</button>
        </div>
        <div id="searchResults" style="max-height:120px; overflow-y:auto;"></div>
        
        <label style="margin-top:10px; display:block;">Or Direct Song MP3 URL:</label>
        <input type="text" id="customSongUrl" placeholder="https://example.com/song.mp3">

        <h4 style="margin-top:15px; margin-bottom:5px;">⏱️ Timeline Audio Timestamps (Seconds):</h4>
        <div class="grid-2">
            <div><label>Cover (Sec):</label><input type="number" id="p1Time" value="0"></div>
            <div><label>Scratch (Sec):</label><input type="number" id="p2Time" value="10"></div>
            <div><label>Gallery (Sec):</label><input type="number" id="p3Time" value="20"></div>
            <div><label>Wishes (Sec):</label><input type="number" id="p4Time" value="30"></div>
        </div>
    </div>

    <button style="max-width:500px; display:block; margin:0 auto; background:#00f5d4; color:#000;" onclick="saveAll()">SAVE ALL SETTINGS ✨</button>

    <script>
        let uploadedPhotos = [];

        // Load existing
        document.getElementById('photoUrls').value = localStorage.getItem('cfg_photos_urls') || "";
        document.getElementById('customSongUrl').value = localStorage.getItem('cfg_music') || "";

        function handleImageUpload(e) {
            uploadedPhotos = [];
            Array.from(e.target.files).slice(0, 4).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) { uploadedPhotos.push(evt.target.result); };
                reader.readAsDataURL(file);
            });
        }

        async function searchTracks() {
            const query = document.getElementById('songQuery').value.trim();
            if(!query) return;
            const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=56d30c95&format=json&limit=4&search=${encodeURIComponent(query)}`);
            const data = await res.json();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "";
            data.results.forEach(track => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `<span>${track.name}</span><button onclick="document.getElementById('customSongUrl').value='${track.audio}'">Select</button>`;
                resultsDiv.appendChild(div);
            });
        }

        function saveAll() {
            if(uploadedPhotos.length > 0) {
                localStorage.setItem('cfg_photos', uploadedPhotos.join('|||'));
            } else if(document.getElementById('photoUrls').value) {
                localStorage.setItem('cfg_photos', document.getElementById('photoUrls').value.split(',').join('|||'));
                localStorage.setItem('cfg_photos_urls', document.getElementById('photoUrls').value);
            }

            const songUrl = document.getElementById('customSongUrl').value;
            localStorage.setItem('cfg_music', songUrl);

            const timeline = {
                page1: { startTime: parseInt(document.getElementById('p1Time').value) || 0 },
                page2: { startTime: parseInt(document.getElementById('p2Time').value) || 10 },
                page3: { startTime: parseInt(document.getElementById('p3Time').value) || 20 },
                page4: { startTime: parseInt(document.getElementById('p4Time').value) || 30 }
            };
            localStorage.setItem('cfg_audio_timeline', JSON.stringify(timeline));

            alert("Settings Saved Successfully! ✨");
        }
    </script>
</body>
</html>
