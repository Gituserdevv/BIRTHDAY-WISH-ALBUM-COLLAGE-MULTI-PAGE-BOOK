<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Studio | Master Control Panel</title>
    <style>
        :root {
            --bg: #0b0710;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 117, 143, 0.25);
            --accent: #ff758f;
            --accent-cyan: #00f5d4;
            --text: #ffb3c1;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #fff;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1.05rem;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .photo-slot {
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            text-align: center;
        }

        .photo-slot label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
        }

        .preview-box {
            width: 100%;
            height: 90px;
            background: #150d21;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-box span {
            font-size: 0.7rem;
            color: #666;
        }

        input[type="file"], input[type="text"], input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            background: #160d21;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent-cyan);
            color: #000;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .song-item {
            background: #160d21;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .song-item button {
            background: var(--accent);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>⚙️ Studio Master Studio</h1>
        <small style="color:#888;">Complete Layout & Media Asset Manager</small>
    </div>

    <!-- 1. DEDICATED SLOTTED PHOTO MANAGER -->
    <div class="card">
        <h2>🖼️ Photo Slots (Dedicated Pages)</h2>
        <div class="slot-grid">
            <!-- Slot 1 -->
            <div class="photo-slot">
                <label>1. Cover Photo</label>
                <div class="preview-box" id="pBox1"><span>No Image</span></div>
                <input type="file" accept="image/*" onchange="processSlot(event, 0)">
                <input type="text" id="url1" placeholder="Or URL..." onchange="updateFromUrl(this.value, 0)">
            </div>
            <!-- Slot 2 -->
            <div class="photo-slot">
                <label>2. Scratch Card</label>
                <div class="preview-box" id="pBox2"><span>No Image</span></div>
                <input type="file" accept="image/*" onchange="processSlot(event, 1)">
                <input type="text" id="url2" placeholder="Or URL..." onchange="updateFromUrl(this.value, 1)">
            </div>
            <!-- Slot 3 -->
            <div class="photo-slot">
                <label>3. Gallery Image 1</label>
                <div class="preview-box" id="pBox3"><span>No Image</span></div>
                <input type="file" accept="image/*" onchange="processSlot(event, 2)">
                <input type="text" id="url3" placeholder="Or URL..." onchange="updateFromUrl(this.value, 2)">
            </div>
            <!-- Slot 4 -->
            <div class="photo-slot">
                <label>4. Gallery Image 2</label>
                <div class="preview-box" id="pBox4"><span>No Image</span></div>
                <input type="file" accept="image/*" onchange="processSlot(event, 3)">
                <input type="text" id="url4" placeholder="Or URL..." onchange="updateFromUrl(this.value, 3)">
            </div>
        </div>
    </div>

    <!-- 2. MUSIC ENGINE & TIMELINES -->
    <div class="card">
        <h2>🎵 Audio & Timeline Engine</h2>
        
        <label style="font-size:0.8rem; color:#aaa;">In-App Track Search Engine:</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="text" id="songSearch" placeholder="Search track name...">
            <button style="width:25%; background:var(--accent); border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="searchTrack()">Search</button>
        </div>
        <div id="searchResults"></div>

        <label style="font-size:0.8rem; color:#aaa; margin-top:12px; display:block;">Or Direct MP3 Track URL:</label>
        <input type="text" id="audioUrl" placeholder="https://domain.com/song.mp3">

        <h4 style="margin: 15px 0 8px 0; font-size: 0.85rem; color: var(--accent-cyan);">⏱️ Precise Audio Offset Timestamps (Secs):</h4>
        <div class="grid-2">
            <div><label style="font-size:0.75rem;">Cover Sec:</label><input type="number" id="t1" value="0"></div>
            <div><label style="font-size:0.75rem;">Scratch Sec:</label><input type="number" id="t2" value="10"></div>
            <div><label style="font-size:0.75rem;">Gallery Sec:</label><input type="number" id="t3" value="20"></div>
            <div><label style="font-size:0.75rem;">Wishes Sec:</label><input type="number" id="t4" value="30"></div>
        </div>
    </div>

    <button class="btn-primary" onclick="commitChanges()">DEPLOY TO ALBUM ✨</button>
</div>

<script>
    let photoSlots = ["", "", "", ""];

    // Compressed Image Handler (Fixes broken image issue)
    function processSlot(event, index) {
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Compress dimensions to avoid localStorage overflow
                const maxDim = 800;
                let w = img.width;
                let h = img.height;
                if(w > maxDim || h > maxDim) {
                    if(w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }

                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);

                const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                photoSlots[index] = compressedData;
                renderPreview(index, compressedData);
            }
        };
        reader.readAsDataURL(file);
    }

    function updateFromUrl(url, index) {
        if(!url) return;
        photoSlots[index] = url;
        renderPreview(index, url);
    }

    function renderPreview(index, src) {
        const box = document.getElementById(`pBox${index + 1}`);
        box.innerHTML = `<img src="${src}">`;
    }

    async function searchTrack() {
        const query = document.getElementById('songSearch').value;
        if(!query) return;
        const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=56d30c95&format=json&limit=3&search=${encodeURIComponent(query)}`);
        const data = await res.json();
        const results = document.getElementById('searchResults');
        results.innerHTML = "";
        data.results.forEach(t => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.innerHTML = `<span>${t.name}</span><button onclick="document.getElementById('audioUrl').value='${t.audio}'">Select</button>`;
            results.appendChild(item);
        });
    }

    function commitChanges() {
        localStorage.setItem('cfg_photos', photoSlots.join('|||'));
        localStorage.setItem('cfg_music', document.getElementById('audioUrl').value);
        
        const timeline = {
            page1: { startTime: parseInt(document.getElementById('t1').value) || 0 },
            page2: { startTime: parseInt(document.getElementById('t2').value) || 10 },
            page3: { startTime: parseInt(document.getElementById('t3}).value) || 20 },
            page4: { startTime: parseInt(document.getElementById('t4').value) || 30 }
        };
        localStorage.setItem('cfg_audio_timeline', JSON.stringify(timeline));

        alert("Album Assets Successfully Deployed! Open index.html to test.");
    }
</script>
</body>
</html>
