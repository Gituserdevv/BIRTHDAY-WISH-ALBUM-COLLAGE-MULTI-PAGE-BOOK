<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Studio Administrator</title>
    <style>
        :root {
            --bg: #fff5f7;
            --card-bg: #ffffff;
            --accent: #ff758f;
            --dark: #3a2228;
            --border: #ffccd5;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.2s; }
        body { background: var(--bg); color: var(--dark); margin: 0; padding: 15px; font-size: 0.8rem; }
        .wrapper { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .header { background: var(--card-bg); border: 1px solid var(--border); padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px rgba(255,117,143,0.1); }
        .header h1 { margin: 0; font-size: 1.1rem; color: var(--accent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
        .panel h2 { margin: 0 0 10px 0; font-size: 0.85rem; color: var(--accent); border-bottom: 1px solid var(--bg); padding-bottom: 4px; }
        
        .form-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .form-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        .group { display: flex; flex-direction: column; gap: 3px; }
        .group label { font-size: 0.7rem; font-weight: 700; }
        input, select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.75rem; width: 100%; }

        .photo-slot { background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 6px; text-align: center; }
        .preview { width: 100%; height: 50px; background: #fff; border-radius: 6px; overflow: hidden; margin-bottom: 4px; border: 1px solid var(--border); display:flex; align-items:center; justify-content:center;}
        .preview img { width: 100%; height: 100%; object-fit: cover; }

        .btn-main { background: var(--accent); color: #fff; border: none; padding: 8px 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .btn-reset { background: #fff; border: 1px solid var(--border); padding: 8px 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <div>
                <h1>🌸 Master Studio Administrator</h1>
                <p style="margin:0; font-size:0.7rem; color:#888;">Full Control over Text, Sizes, Animations, Photos & Music</p>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn-reset" onclick="resetDefaults()">Reset 🔄</button>
                <button class="btn-main" onclick="saveMasterSettings()">Save & Apply ✨</button>
            </div>
        </div>

        <div class="grid">
            <!-- LEFT PANEL -->
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div class="panel">
                    <h2>🖼️ Collage Photo Grid (4 Slot Uploads)</h2>
                    <div class="form-4">
                        <div class="photo-slot">
                            <div class="preview" id="prev0">Photo 1</div>
                            <input type="file" onchange="uploadPhoto(event, 0)" accept="image/*">
                        </div>
                        <div class="photo-slot">
                            <div class="preview" id="prev1">Photo 2</div>
                            <input type="file" onchange="uploadPhoto(event, 1)" accept="image/*">
                        </div>
                        <div class="photo-slot">
                            <div class="preview" id="prev2">Photo 3</div>
                            <input type="file" onchange="uploadPhoto(event, 2)" accept="image/*">
                        </div>
                        <div class="photo-slot">
                            <div class="preview" id="prev3">Photo 4</div>
                            <input type="file" onchange="uploadPhoto(event, 3)" accept="image/*">
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2>✍️ Text Customization & Font Styles</h2>
                    <div class="form-3">
                        <div class="group">
                            <label>Album Title Text</label>
                            <input type="text" id="cfgTitle" value="CHAPTER II • MEMORIES COLLAGE">
                        </div>
                        <div class="group">
                            <label>Font Family Style</label>
                            <select id="cfgFont">
                                <option value="'Poppins', sans-serif">Modern Clean (Poppins)</option>
                                <option value="'Dancing Script', cursive">Romantic Cursive Script</option>
                                <option value="'Playfair Display', serif">Royal Serif</option>
                            </select>
                        </div>
                        <div class="group">
                            <label>Title Size</label>
                            <select id="cfgTitleSize">
                                <option value="0.9rem">Small</option>
                                <option value="1.1rem" selected>Medium</option>
                                <option value="1.4rem">Large</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2>📐 Layout, Photo Sizes & Animations</h2>
                    <div class="form-3">
                        <div class="group">
                            <label>Photo Grid Height</label>
                            <select id="cfgPhotoHeight">
                                <option value="110px">Compact (110px)</option>
                                <option value="140px" selected>Medium (140px)</option>
                                <option value="170px">Large (170px)</option>
                            </select>
                        </div>
                        <div class="group">
                            <label>Photo Corner Curves</label>
                            <select id="cfgBorderRadius">
                                <option value="6px">Sharp Curves (6px)</option>
                                <option value="14px" selected>Smooth Curves (14px)</option>
                                <option value="24px">Extra Rounded (24px)</option>
                            </select>
                        </div>
                        <div class="group">
                            <label>Blast Particle Effect</label>
                            <select id="cfgParticleType">
                                <option value="flower">Flowers 🌸 & Pink Glow</option>
                                <option value="star">Stars ⭐ & Gold Sparkles</option>
                                <option value="glitter">Glitter Hearts 💖</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div class="panel">
                    <h2>🎵 Page Wise Music Sync (Leave Blank for Built-in Auto Songs)</h2>
                    <div class="form-2">
                        <div class="group" style="background:var(--bg); padding:6px; border-radius:6px;">
                            <label style="color:var(--accent)">1. Cover Page Song</label>
                            <input type="text" id="songUrl_p1" placeholder="MP3 Link (Auto Default)">
                        </div>
                        <div class="group" style="background:var(--bg); padding:6px; border-radius:6px;">
                            <label style="color:var(--accent)">2. Scratch Card Song</label>
                            <input type="text" id="songUrl_p2" placeholder="MP3 Link (Auto Default)">
                        </div>
                        <div class="group" style="background:var(--bg); padding:6px; border-radius:6px;">
                            <label style="color:var(--accent)">3. Collage Page Song</label>
                            <input type="text" id="songUrl_p3" placeholder="MP3 Link (Auto Default)">
                        </div>
                        <div class="group" style="background:var(--bg); padding:6px; border-radius:6px;">
                            <label style="color:var(--accent)">4. Candle/Wish Page Song</label>
                            <input type="text" id="songUrl_p4" placeholder="MP3 Link (Auto Default)">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let photos = ["", "", "", ""];

        window.onload = function() {
            const saved = localStorage.getItem('cfg_photos');
            if (saved) {
                photos = saved.split('|||');
                photos.forEach((src, idx) => {
                    if (src) document.getElementById(`prev${idx}`).innerHTML = `<img src="${src}">`;
                });
            }
            document.getElementById('cfgTitle').value = localStorage.getItem('cfg_title') || 'CHAPTER II • MEMORIES COLLAGE';
            document.getElementById('cfgFont').value = localStorage.getItem('cfg_font') || "'Poppins', sans-serif";
            document.getElementById('cfgTitleSize').value = localStorage.getItem('cfg_title_size') || "1.1rem";
            document.getElementById('cfgPhotoHeight').value = localStorage.getItem('cfg_photo_height') || "140px";
            document.getElementById('cfgBorderRadius').value = localStorage.getItem('cfg_border_radius') || "14px";
            document.getElementById('cfgParticleType').value = localStorage.getItem('cfg_particle_type') || "flower";

            const songs = JSON.parse(localStorage.getItem('cfg_multi_songs') || '{}');
            for(let i=1; i<=4; i++) {
                if (songs[`p${i}`]) document.getElementById(`songUrl_p${i}`).value = songs[`p${i}`].url || '';
            }
        };

        function uploadPhoto(event, idx) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                photos[idx] = e.target.result;
                document.getElementById(`prev${idx}`).innerHTML = `<img src="${e.target.result}">`;
            };
            reader.readAsDataURL(file);
        }

        function resetDefaults() {
            if(confirm("Reset all customizations?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function saveMasterSettings() {
            localStorage.setItem('cfg_photos', photos.join('|||'));
            localStorage.setItem('cfg_title', document.getElementById('cfgTitle').value);
            localStorage.setItem('cfg_font', document.getElementById('cfgFont').value);
            localStorage.setItem('cfg_title_size', document.getElementById('cfgTitleSize').value);
            localStorage.setItem('cfg_photo_height', document.getElementById('cfgPhotoHeight').value);
            localStorage.setItem('cfg_border_radius', document.getElementById('cfgBorderRadius').value);
            localStorage.setItem('cfg_particle_type', document.getElementById('cfgParticleType').value);

            const songs = {
                p1: { url: document.getElementById('songUrl_p1').value },
                p2: { url: document.getElementById('songUrl_p2').value },
                p3: { url: document.getElementById('songUrl_p3').value },
                p4: { url: document.getElementById('songUrl_p4').value }
            };
            localStorage.setItem('cfg_multi_songs', JSON.stringify(songs));

            alert("All Configurations & Customizations Applied Successfully! ✨");
        }
    </script>
</body>
</html>
